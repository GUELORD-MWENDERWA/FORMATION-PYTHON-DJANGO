{% comment %}
  partials/theme_switch.html - bouton clair/sombre.
  A inclure dans l'en-tete de chaque page de contenu.
  Le script.js s'attend a trouver un ".mode-switch" sur la page.
{% endcomment %}
<button class="mode-switch" title="Changer de theme">
  <svg
    class="moon"
    fill="none"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2"
    width="24"
    height="24"
    viewBox="0 0 24 24"
  >
    <defs></defs>
    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
  </svg>
</button>
