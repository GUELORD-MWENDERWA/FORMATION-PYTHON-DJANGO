{% extends "base.html" %}
{% comment %}
  clients/form.html - ajout / modification d'un client.
{% endcomment %}

{% block title %}Ajouter un client - GestionPharmacie{% endblock %}

{% block content %}

  <div class="app-content-header">
    <a href="{% url 'clients_liste' %}" class="back-button" aria-label="Retour aux clients">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <h1 class="app-content-headerText">Ajouter un client</h1>
    {% include "partials/theme_switch.html" %}
  </div>

  <form class="form-card">
    <div class="form-grid">
      <div class="form-group">
        <label for="client-nom">Nom</label>
        <input type="text" id="client-nom" name="nom" placeholder="Nom de famille" />
      </div>
      <div class="form-group">
        <label for="client-prenom">Prenom</label>
        <input type="text" id="client-prenom" name="prenom" placeholder="Prenom" />
      </div>

      <div class="form-group">
        <label for="client-telephone">Telephone</label>
        <input type="tel" id="client-telephone" name="telephone" placeholder="+243 970 000 000" />
      </div>
      <div class="form-group">
        <label for="client-email">Email</label>
        <input type="email" id="client-email" name="email" placeholder="client@example.com" />
      </div>

      <div class="form-group">
        <label for="client-naissance">Date de naissance</label>
        <input type="date" id="client-naissance" name="date_naissance" />
      </div>
      <div class="form-group">
        <label for="client-adresse">Adresse</label>
        <input type="text" id="client-adresse" name="adresse" placeholder="Adresse" />
      </div>

      <div class="form-group full-width">
        <label for="client-notes">Notes (allergies, traitements en cours...)</label>
        <textarea id="client-notes" name="notes" placeholder="Informations utiles pour le pharmacien"></textarea>
      </div>
    </div>

    <div class="form-actions">
      <a href="{% url 'clients_liste' %}" class="btn btn-secondary">Annuler</a>
      <button type="submit" class="btn btn-primary">Enregistrer le client</button>
    </div>
  </form>

{% endblock %}
